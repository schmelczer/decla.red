name: Build & deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Build & deploy website
    runs-on: ${{ (github.actor == 'renovate-bot' || github.event.pull_request.user.login == 'renovate-bot' || startsWith(github.ref, 'refs/heads/renovate/') || startsWith(github.head_ref,
      'renovate/')) && 'renovate' || 'docker' }}
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

        with:
          persist-credentials: false
      - name: Setup Node
        uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix shared ci
          npm --prefix frontend ci
          npm --prefix backend ci

      - name: Build (shared -> frontend -> backend)
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint:check

      - name: Upload static site artifact 1
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: pages-website-0
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1
    if: ${{ contains(fromJSON('["andras","ruby336688","renovate-bot"]'), github.actor) && (!github.event.pull_request || contains(fromJSON('["andras","ruby336688","renovate-bot"]'),
      github.event.pull_request.user.login)) }}
  server-image:
    name: Build & publish server image
    runs-on: ${{ (github.actor == 'renovate-bot' || github.event.pull_request.user.login == 'renovate-bot' || startsWith(github.ref, 'refs/heads/renovate/') || startsWith(github.head_ref,
      'renovate/')) && 'renovate' || 'docker' }}
    if: ${{ contains(fromJSON('["andras","ruby336688","renovate-bot"]'), github.actor) && (!github.event.pull_request || contains(fromJSON('["andras","ruby336688","renovate-bot"]'),
      github.event.pull_request.user.login)) && (github.event_name != 'pull_request') }}
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

        with:
          persist-credentials: false
      - name: Build and publish server image
        uses: https://git.schmelczer.dev/andras/ci-actions/docker-publish@c80f2f0701d7618f1f0b2bb52ebd332ea34b6e28
        with:
          context: .
          image-suffix: -server
          token: ${{ !(github.actor == 'renovate-bot' || github.event.pull_request.user.login == 'renovate-bot' || startsWith(github.ref, 'refs/heads/renovate/')
            || startsWith(github.head_ref, 'renovate/')) && (secrets.FORGEJO_PACKAGE_TOKEN) || '' }}
          push: ${{ !(github.actor == 'renovate-bot' || github.event.pull_request.user.login == 'renovate-bot' || startsWith(github.ref, 'refs/heads/renovate/') ||
            startsWith(github.head_ref, 'renovate/')) && (true) }}
  website-pages:
    name: Deploy static site artifacts
    needs: website
    if: ${{ contains(fromJSON('["andras","ruby336688","renovate-bot"]'), github.actor) && (!github.event.pull_request || contains(fromJSON('["andras","ruby336688","renovate-bot"]'),
      github.event.pull_request.user.login)) && (!(github.actor == 'renovate-bot' || github.event.pull_request.user.login == 'renovate-bot' || startsWith(github.ref,
      'refs/heads/renovate/') || startsWith(github.head_ref, 'renovate/'))) && ((github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: pages
    container:
      image: node:22-bookworm@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
      volumes:
        - /pages/doppler:/pages/doppler
    concurrency:
      group: pages-deploy-decla-red
      cancel-in-progress: false
    steps:
      - name: Download static site artifact 1
        uses: https://github.com/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: pages-website-0
          path: frontend/dist
      - name: Deploy to host pages mount
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: https://git.schmelczer.dev/andras/ci-actions/deploy-pages@c80f2f0701d7618f1f0b2bb52ebd332ea34b6e28
        with:
          source: frontend/dist
          target: doppler

