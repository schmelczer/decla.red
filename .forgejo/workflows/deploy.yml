name: Build & deploy

on:
  push:
    branches:
      - '**'
    tags:
      - v*
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Build & deploy website
    runs-on: docker
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node
        uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix shared ci
          npm --prefix frontend ci
          npm --prefix backend ci
      - name: Build (shared -> frontend -> backend)
        run: npm run build
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint:check
      - name: Upload static site artifact 1
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: pages-website-0
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1
  server-image:
    name: Build & publish server image
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and publish server image
        uses: https://git.schmelczer.dev/andras/ci-actions/docker-publish@10ab5db88c5f6fc1d2a368ce0ea934807f7ebfca
        with:
          context: .
          image-suffix: -server
          token: ${{ ((github.ref == 'refs/heads/main' || github.ref_type == 'tag')) && secrets.FORGEJO_PACKAGE_TOKEN || '' }}
          push: ${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
